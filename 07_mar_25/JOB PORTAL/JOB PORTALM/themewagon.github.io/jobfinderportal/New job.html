<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Online Job Portal - Add Job</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
  />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto&display=swap');
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex">
  <!-- Sidebar -->
  <aside class="flex flex-col bg-purple-700 text-white w-56">
    <div class="px-4 py-3 border-b border-purple-800">
     <h1 class="font-extrabold types new roman text-sm select-none">
      Admin Area
     </h1>
    </div>
    <nav class="flex-1 px-2 py-4 space-y-2 overflow-y-auto">
     <a aria-current="page" class="flex items-center gap-3 px-3 py-2 rounded-md bg-purple-900 text-white" href="Admin Dashboard.html">
      <i class="fas fa-palette text-lg">
      </i>
      <span class="text-types new roman">
       Dashboard
      </span>
     </a>
     <a class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-purple-800" href="New job.html">
      <i class="fas fa-plus-square text-sm">
      </i>
      <span class="text-types new roman">New Job</span>
     </a>
     <a class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-purple-800" href="Joblist.html">
      <i class="fas fa-briefcase text-sm">
      </i>
      <span class="text-types new roman">
       Job List
      </span>
     </a>
     <a class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-purple-800" href="Viewresume.html">
      <i class="fas fa-file-alt text-sm">
      </i>
      <span class="text-types new roman">
       View Resume
      </span>
     </a>
     <a class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-purple-800" href="Contact2.html">
      <i class="fas fa-comments text-sm">
      </i>
      <span class="text-types new roman">
       Contact List
      </span>
     </a>
    </nav>
    <div class="p-4 border-t border-purple-800">
     <button class="w-full text-xs font-normal border border-purple-400 rounded-md py-1.5 hover:bg-purple-800 transition" type="button">
      Logout
     </button>
    </div>
   </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto">
    <header class="border-b border-gray-300 p-4">
      <h1 class="text-purple-700 font-semibold text-lg">Online Job Portal</h1>
    </header>

    <section class="p-6 max-w-5xl mx-auto">
      <h1 class="text-center text-gray-500 text-lg mb-8">Add Job</h1>
      <form class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6 text-gray-600 text-xs">
        <div class="flex flex-col">
          <label for="jobTitle" class="mb-1 font-semibold">Job Title</label>
          <input
            id="jobTitle"
            type="text"
            placeholder="Ex Web Developer App Developer"
            class="border border-gray-300 rounded px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-300"
          />
        </div>
        <div class="flex flex-col">
          <label for="numPost" class="mb-1 font-semibold">Number Of Post</label>
          <select
            id="numPost"
            class="border border-gray-300 rounded px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-300"
          >
            <option disabled selected>Enter Number Of Position</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
          </select>
        </div>

        <div class="flex flex-col md:col-span-2">
          <label for="description" class="mb-1 font-semibold">Description</label>
          <textarea
            id="description"
            rows="3"
            placeholder="Enter Job Description"
            class="border border-gray-300 rounded px-3 py-2 text-xs placeholder-gray-400 resize-none focus:outline-none focus:ring-1 focus:ring-blue-300"
          ></textarea>
        </div>

        <div class="flex flex-col">
          <label for="qualification" class="mb-1 font-semibold">Qualification/Education Required</label>
          <input
            id="qualification"
            type="text"
            placeholder="Ex MCA, BTech, MBA"
            class="border border-gray-300 rounded px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-300"
          />
        </div>
        <div class="flex flex-col">
          <label for="experience" class="mb-1 font-semibold">Experience Required</label>
          <input
            id="experience"
            type="text"
            placeholder="Ex 2 Years, 15 Years"
            class="border border-gray-300 rounded px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-300"
          />
        </div>

        <div class="flex flex-col">
          <label for="specialization" class="mb-1 font-semibold">Specialization Required</label>
          <input
            id="specialization"
            type="text"
            placeholder="Enter Specialization"
            class="border border-gray-300 rounded px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-300"
          />
        </div>
        <div class="flex flex-col">
          <label for="lastDate" class="mb-1 font-semibold">Last Date To Apply</label>
          <input
            id="lastDate"
            type="date"
            placeholder="dd/mm/yyyy"
            class="border border-gray-300 rounded px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-300"
          />
        </div>

        <div class="flex flex-col">
          <label for="salary" class="mb-1 font-semibold">Salary</label>
          <input
            id="salary"
            type="text"
            placeholder="Enter Salary"
            class="border border-gray-300 rounded px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-300"
          />
        </div>
        <div class="flex flex-col">
          <label for="jobType" class="mb-1 font-semibold">Job Type</label>
          <select
            id="jobType"
            class="border border-gray-300 rounded px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-300"
          >
            <option disabled selected>Select Jobtype</option>
            <option>Full Time</option>
            <option>Part Time</option>
            <option>Contract</option>
            <option>Internship</option>
          </select>
        </div>

        <div class="flex flex-col">
          <label for="companyName" class="mb-1 font-semibold">Company/Organisation Name</label>
          <input
            id="companyName"
            type="text"
            placeholder="Enter Company/Organisation Name"
            class="border border-gray-300 rounded px-3 py-2 text-xs placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-300"
          />
        </div>
        <div class="flex flex-col">
          <label for="companyLogo" class="mb-1 font-semibold">Company/Organisation Logo</label>
          <input
            id="companyLogo"
            type="file"
            class="border border-gray-300 rounded px-3 py-1 text-xs placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-300"
          />
        </div>
        <div class="flex flex-col md:flex-row md:space-x-6 space-y-4 md:space-y-0">
          <div class="flex-1">
            <label for="website" class="block text-gray-600 text-sm font-semibold mb-1">Website</label>
            <input
              id="website"
              type="text"
              placeholder="Enter Website"
              class="w-full border border-gray-300 rounded px-3 py-2 text-gray-500 text-sm placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-purple-700 focus:border-purple-700"
            />
          </div>
          <div class="flex-1">
            <label for="email" class="block text-gray-600 text-sm font-semibold mb-1">Email</label>
            <input
              id="email"
              type="email"
              value=""
              class="w-full border border-gray-300 rounded px-3 py-2 text-gray-700 text-sm focus:outline-none focus:ring-1 focus:ring-purple-700 focus:border-purple-700"
            />
          </div>
        </div>
    
        <div>
          <label for="address" class="block text-gray-600 text-sm font-semibold mb-1">Address</label>
          <textarea
            id="address"
            rows="2"
            class="w-full border border-gray-300 rounded px-3 py-2 text-gray-700 text-sm resize-none focus:outline-none focus:ring-1 focus:ring-purple-700 focus:border-purple-700"
          ></textarea>
        </div>
    
        <div class="flex flex-col md:flex-row md:space-x-6 space-y-4 md:space-y-0">
          <div class="flex-1">
            <label for="country" class="block text-gray-600 text-sm font-semibold mb-1">Country</label>
            <select
              id="country"
              class="w-full border border-gray-300 rounded px-3 py-2 text-gray-500 text-sm focus:outline-none focus:ring-1 focus:ring-purple-700 focus:border-purple-700"
            >
              <option>United States</option>
            </select>
          </div>
          <div class="flex-1">
            <label for="state" class="block text-gray-600 text-sm font-semibold mb-1">State</label>
            <input
              id="state"
              type="text"
              value=""
              class="w-full border border-gray-300 rounded px-3 py-2 text-gray-700 text-sm focus:outline-none focus:ring-1 focus:ring-purple-700 focus:border-purple-700"
            />
          </div>
        </div>
    
        <button
          type="submit"
          class="mt-4 bg-gradient-to-r from-purple-700 to-purple-900 text-white text-sm font-semibold rounded px-6 py-2 w-32"
        >
          Update
        </button>
      </form>
    </section>
  </main>
</body>
</html>
